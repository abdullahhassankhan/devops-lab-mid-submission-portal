
name: DevOps Lab Mid CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  automated-tests:
    name: Flask Automated Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Step 2: Set up Python
      - name: Set Up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Step 4: Execute automated tests
      - name: Run Automated Pytest Tests
        run: |
          mkdir -p reports
          python -m pytest -v tests --junitxml=reports/junit.xml

      # Step 5: Send actual results to local receiver
      # Run even if tests fail, on push events only.
      - name: Send Test Report to Local Receiver
        if: ${{ always() && github.event_name == 'push' }}
        env:
          REPORT_RECEIVER_URL: ${{ secrets.REPORT_RECEIVER_URL }}
          REPORT_RECEIVER_TOKEN: ${{ secrets.REPORT_RECEIVER_TOKEN }}
        run: |
          python receiver/send_report.py

      # Step 6: Upload test result artifacts
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-test-results
          path: |
            reports/junit.xml
            reports/ci-test-report.json
          if-no-files-found: warn

      # Step 7: Automatic Email Reporting
      # Send email for passing and failing test runs.
      - name: Send Automated Email Report
        if: ${{ always() && github.event_name == 'push' }}
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: |
          python receiver/send_email.py

  # GitHub Pages Bonus Deployment
  # Deploy only when automated-tests succeeds
  # on a push to the main branch.
  deploy-pages:
    name: Deploy Static Portal to GitHub Pages
    needs: automated-tests

    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Step 2: Verify static website files
      - name: Verify Static Website Files
        run: |
          test -f site/index.html
          test -f site/style.css
          test -f site/script.js

      # Step 3: Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Step 4: Upload website artifact
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      # Step 5: Deploy website
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
